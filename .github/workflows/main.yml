name: Build Kernel + Safe AnyKernel (modules + boot-safe)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  ARCH: arm64
  KBUILD_OUTPUT: out
  DEFCONFIG: obiwan_defconfig

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install packages
        run: |
          sudo apt update
          sudo apt install -y bc bison flex build-essential git ccache curl wget unzip \
            libssl-dev python3 python-is-python3 gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            libncurses-dev rsync zip

      - name: Download Proton Clang
        run: |
          mkdir -p clang
          wget -q https://github.com/kdrag0n/proton-clang/archive/refs/heads/master.zip -O clang.zip
          unzip -q clang.zip -d clang
          mv clang/proton-clang-master/* clang/ || true
          echo "CLANG_PATH=$PWD/clang" >> $GITHUB_ENV
          echo "$PWD/clang/bin" >> $GITHUB_PATH

      - name: Configure kernel (obiwan_defconfig)
        run: |
          export PATH="$PWD/clang/bin:$PATH"
          make O=${KBUILD_OUTPUT} ARCH=${ARCH} ${DEFCONFIG}

      - name: Build kernel and modules
        run: |
          export PATH="$PWD/clang/bin:$PATH"
          export CC="$PWD/clang/bin/clang"
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip
          make -j$(nproc) O=${KBUILD_OUTPUT} ARCH=${ARCH}

      - name: Install modules into temp tree
        run: |
          rm -rf mod_tmp
          mkdir -p mod_tmp
          make -j1 O=${KBUILD_OUTPUT} ARCH=${ARCH} INSTALL_MOD_PATH=$PWD/mod_tmp modules_install || true
          echo "Modules installed (if any):"
          find mod_tmp -type f -name '*.ko' -print || true

      - name: Get kernel release (KVER)
        id: kernelver
        run: |
          KVER=$(make -s O=${KBUILD_OUTPUT} kernelrelease)
          echo "KVER=${KVER}" >> "$GITHUB_OUTPUT"
          echo "Kernel release: ${KVER}"

      - name: Clone AnyKernel3
        run: |
          rm -rf AnyKernel
          git clone https://github.com/osm0sis/AnyKernel3 AnyKernel
          rm -rf AnyKernel/.git || true

      - name: Add safe anykernel.sh (split flash + install modules)
        run: |
          # create a minimal anykernel wrapper that sources ak3-core and performs split/flash and installs modules
          printf '%s\n' '#!/sbin/sh' > AnyKernel/anykernel.sh
          printf '%s\n' "properties() { '" >> AnyKernel/anykernel.sh
          printf '%s\n' "kernel.string=KaetoKernel (obiwan) by Kaeto" >> AnyKernel/anykernel.sh
          printf '%s\n' "do.devicecheck=1" >> AnyKernel/anykernel.sh
          printf '%s\n' "do.modules=1" >> AnyKernel/anykernel.sh
          printf '%s\n' "do.systemless=1" >> AnyKernel/anykernel.sh
          printf '%s\n' "do.cleanup=1" >> AnyKernel/anykernel.sh
          printf '%s\n' "do.cleanuponabort=0" >> AnyKernel/anykernel.sh
          printf '%s\n' "'; }" >> AnyKernel/anykernel.sh
          printf '%s\n' '' >> AnyKernel/anykernel.sh
          printf '%s\n' 'BLOCK=/dev/block/by-name/boot' >> AnyKernel/anykernel.sh
          printf '%s\n' 'IS_SLOT_DEVICE=1' >> AnyKernel/anykernel.sh
          printf '%s\n' '' >> AnyKernel/anykernel.sh
          printf '%s\n' '. tools/ak3-core.sh' >> AnyKernel/anykernel.sh
          printf '%s\n' 'split_boot' >> AnyKernel/anykernel.sh
          printf '%s\n' 'flash_boot' >> AnyKernel/anykernel.sh
          printf '%s\n' 'install_modules' >> AnyKernel/anykernel.sh
          chmod +x AnyKernel/anykernel.sh

      - name: Copy kernel images into AnyKernel
        run: |
          cp -v out/arch/arm64/boot/Image.gz-dtb AnyKernel/ 2>/dev/null || true
          cp -v out/arch/arm64/boot/Image.gz AnyKernel/ 2>/dev/null || true
          cp -v out/arch/arm64/boot/Image AnyKernel/ 2>/dev/null || true
          cp -v out/arch/arm64/boot/dtbo.img AnyKernel/ 2>/dev/null || true

      - name: Copy modules into AnyKernel/modules/<kver>
        run: |
          KVER=${{ steps.kernelver.outputs.KVER }}
          mkdir -p "AnyKernel/modules/${KVER}"
          if [ -d "mod_tmp/lib/modules/${KVER}" ]; then
            cp -v mod_tmp/lib/modules/${KVER}/*.ko "AnyKernel/modules/${KVER}/" || true
          fi
          echo "AnyKernel modules (if any):"
          find AnyKernel/modules -type f -name '*.ko' -print || true

      - name: Add safe service script to ramdisk_patch (insmod + optional script execution)
        run: |
          mkdir -p AnyKernel/ramdisk_patch
          printf '%s\n' '#!/system/bin/sh' > AnyKernel/ramdisk_patch/service.sh
          printf '%s\n' '### Safe service: load module then run optional user script' >> AnyKernel/ramdisk_patch/service.sh
          printf '%s\n' 'insmod /vendor/lib/modules/*.ko 2>/dev/null || true' >> AnyKernel/ramdisk_patch/service.sh
          printf '%s\n' 'insmod /system/lib/modules/*.ko 2>/dev/null || true' >> AnyKernel/ramdisk_patch/service.sh
          printf '%s\n' 'insmod /lib/modules/*.ko 2>/dev/null || true' >> AnyKernel/ramdisk_patch/service.sh
          printf '%s\n' 'if [ -f /data/kaeto/run_after_module.sh ]; then' >> AnyKernel/ramdisk_patch/service.sh
          printf '%s\n' '  sh /data/kaeto/run_after_module.sh || true' >> AnyKernel/ramdisk_patch/service.sh
          printf '%s\n' 'fi' >> AnyKernel/ramdisk_patch/service.sh
          chmod 755 AnyKernel/ramdisk_patch/service.sh

      - name: Write AnyKernel config.txt (A/B + modules)
        run: |
          printf '%s\n' 'kernel.string=KaetoKernel (obiwan) by Kaeto' > AnyKernel/config.txt
          printf '%s\n' 'do.devicecheck=1' >> AnyKernel/config.txt
          printf '%s\n' 'do.modules=1' >> AnyKernel/config.txt
          printf '%s\n' 'do.systemless=1' >> AnyKernel/config.txt
          printf '%s\n' 'do.cleanup=1' >> AnyKernel/config.txt
          printf '%s\n' 'do.cleanuponabort=0' >> AnyKernel/config.txt
          printf '%s\n' 'is_slot_device=1' >> AnyKernel/config.txt
          printf '%s\n' 'block=/dev/block/by-name/boot' >> AnyKernel/config.txt
          printf '%s\n' 'device.name1=obiwan' >> AnyKernel/config.txt
          printf '%s\n' 'device.name2=ZS661KS' >> AnyKernel/config.txt
          printf '%s\n' 'device.name3=ZS661KL' >> AnyKernel/config.txt
          printf '%s\n' 'device.name4=ASUS_I003_1' >> AnyKernel/config.txt
          printf '%s\n' 'device.name5=I003D' >> AnyKernel/config.txt
          printf '%s\n' 'device.name6=I003DD' >> AnyKernel/config.txt

      - name: Create flashable AnyKernel zip (safe)
        run: |
          cd AnyKernel
          zip -r9 ../AnyKernel-safe-${GITHUB_SHA}.zip ./*

      - name: Upload AnyKernel SAFE zip
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel-safe-zip
          path: AnyKernel-safe-*.zip
          if-no-files-found: error

      - name: Upload kernel artifacts and modules
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-artifacts
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/dtbo.img
            mod_tmp/lib/modules/${{ steps.kernelver.outputs.KVER }}/*.ko
          if-no-files-found: warn
