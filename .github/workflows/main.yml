name: Build Kernel

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  ARCH: arm64
  SUBARCH: arm64
  KBUILD_OUTPUT: out
  DEFCONFIG: obiwan_defconfig

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y bc bison flex build-essential git ccache curl \
            libssl-dev python3 python-is-python3

      - name: Download Google Clang 14
        run: |
          mkdir -p clang
          wget https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-14.0.0_r5/clang-r450784d.tar.gz -O clang.tar.gz
          tar -xzf clang.tar.gz -C clang
          echo "CLANG_PATH=$GITHUB_WORKSPACE/clang/bin" >> $GITHUB_ENV

      - name: Export toolchain variables
        run: |
          echo "CC=${CLANG_PATH}/clang" >> $GITHUB_ENV
          echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> $GITHUB_ENV
          echo "CROSS_COMPILE=aarch64-linux-android-" >> $GITHUB_ENV
          echo "CROSS_COMPILE_ARM32=arm-linux-androideabi-" >> $GITHUB_ENV

      - name: Make defconfig
        run: |
          make O=${KBUILD_OUTPUT} $DEFCONFIG

      - name: Build Kernel with Clang
        run: |
          make -j$(nproc) O=${KBUILD_OUTPUT} \
            CC="${CLANG_PATH}/clang" \
            ARCH=arm64

      - name: Install AOSP mkbootimg
        run: |
          git clone https://android.googlesource.com/platform/system/tools/mkbootimg --depth=1
          sudo install -m 0755 mkbootimg/mkbootimg.py /usr/local/bin/mkbootimg

      - name: Build boot.img
        run: |
          mkdir -p out_img
          mkbootimg \
            --kernel ${KBUILD_OUTPUT}/arch/arm64/boot/Image.gz-dtb \
            --ramdisk ramdisk.img \
            --cmdline "console=tty0" \
            --base 0x10000000 \
            --pagesize 2048 \
            --output out_img/boot.img

      - name: Upload boot.img
        uses: actions/upload-artifact@v4
        with:
          name: boot-img
          path: out_img/boot.img
