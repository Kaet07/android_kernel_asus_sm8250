name: Build Kernel

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  ARCH: arm64
  SUBARCH: arm64
  KBUILD_OUTPUT: out
  DEFCONFIG: obiwan_defconfig

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install required packages
        run: |
          sudo apt update
          sudo apt install -y \
            bc bison flex build-essential git ccache curl wget unzip \
            libssl-dev python3 python-is-python3 \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi

      - name: Download AOSP Clang
        run: |
          mkdir -p clang
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master/clang-r530567.tar.gz -O clang.tar.gz
          tar -xzf clang.tar.gz -C clang
          echo "CLANG_PATH=$PWD/clang" >> $GITHUB_ENV
          echo "$PWD/clang/bin" >> $GITHUB_PATH

      - name: Export toolchain variables
        run: |
          echo "CC=$CLANG_PATH/bin/clang" >> $GITHUB_ENV
          echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
          echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> $GITHUB_ENV
          echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> $GITHUB_ENV

      # ---------------------------------------------------------
      # BUILD DEFCONFIG
      # ---------------------------------------------------------

      - name: Make defconfig
        run: |
          make O=${KBUILD_OUTPUT} $DEFCONFIG

      # ---------------------------------------------------------
      # BUILD KERNEL (WITH WARNINGS DISABLED)
      # ---------------------------------------------------------

      - name: Build Kernel Image
        run: |
          make -j$(nproc) \
            O=${KBUILD_OUTPUT} \
            ARCH=arm64 \
            KCFLAGS="-Wno-error" \
            KBUILD_CFLAGS="-Wno-error" \
            KBUILD_CPPFLAGS="-Wno-error" \
            CC="$CLANG_PATH/bin/clang"

      # ---------------------------------------------------------
      # BUILD MODULES (ALSO DISABLE WERROR)
      # ---------------------------------------------------------

      - name: Build Kernel Modules
        run: |
          make -j$(nproc) \
            O=${KBUILD_OUTPUT} \
            ARCH=arm64 \
            KCFLAGS="-Wno-error" \
            KBUILD_CFLAGS="-Wno-error" \
            KBUILD_CPPFLAGS="-Wno-error" \
            modules

      # ---------------------------------------------------------
      # BUILD DTBO
      # ---------------------------------------------------------

      - name: Build DTBO image
        run: |
          make -j$(nproc) \
            O=${KBUILD_OUTPUT} \
            ARCH=arm64 \
            dtboimg || true

      # ---------------------------------------------------------
      # ANYKERNEL PACKAGING
      # ---------------------------------------------------------

      - name: Clone AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3 AnyKernel

      - name: Copy kernel output to AnyKernel3
        run: |
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel/ || true
          cp out/arch/arm64/boot/Image.gz AnyKernel/ || true
          cp out/arch/arm64/boot/Image AnyKernel/ || true
          cp out/arch/arm64/boot/dtbo.img AnyKernel/ || true

      - name: Create flashable ZIP
        run: |
          cd AnyKernel
          zip -r9 ../AnyKernel-${GITHUB_SHA}.zip ./*

      - name: Upload Kernel Files
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Artifacts
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/dtbo.img
          if-no-files-found: warn

      - name: Upload AnyKernel3 ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Flashable-AnyKernel3
          path: AnyKernel-*.zip
          if-no-files-found: error
