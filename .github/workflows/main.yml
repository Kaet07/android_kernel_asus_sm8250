name: Build Kernel

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  ARCH: arm64
  SUBARCH: arm64
  KBUILD_OUTPUT: out
  DEFCONFIG: obiwan_defconfig

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y bc bison flex build-essential gcc-aarch64-linux-gnu \
            libssl-dev git ccache curl python3 python-is-python3 mkbootimg-utils

      - name: Setup AArch64 toolchain
        run: |
          mkdir -p toolchain
          git clone --depth=1 https://github.com/arter97/arm64-gcc toolchain/gcc
          echo "CROSS_COMPILE=$GITHUB_WORKSPACE/toolchain/gcc/bin/aarch64-linux-gnu-" >> $GITHUB_ENV

      - name: Make defconfig
        run: |
          make O=${KBUILD_OUTPUT} $DEFCONFIG

      - name: Build Kernel
        run: |
          make -j$(nproc) O=${KBUILD_OUTPUT}

      - name: Build boot.img
        run: |
          mkdir -p out_img
          mkbootimg \
            --kernel ${KBUILD_OUTPUT}/arch/arm64/boot/Image.gz-dtb \
            --ramdisk ramdisk.img \
            --cmdline "console=tty0" \
            --os_version 12 \
            --os_patch_level 2023-01 \
            --base 0x10000000 \
            --pagesize 2048 \
            --output out_img/boot.img

      - name: Upload boot.img
        uses: actions/upload-artifact@v3
        with:
          name: boot.img
          path: out_img/boot.img
