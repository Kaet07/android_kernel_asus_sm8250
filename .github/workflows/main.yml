name: Kernel Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # -----------------------------------------------------
      # INSTALL DEPENDENCIES
      # -----------------------------------------------------
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            libssl-dev bc bison flex libncurses5-dev dwarves ccache unzip

      # -----------------------------------------------------
      # DOWNLOAD CLANG TOOLCHAIN
      # -----------------------------------------------------
      - name: Download Clang 17
        run: |
          mkdir clang
          wget https://github.com/llvm/llvm-project/releases/download/llvmorg-17.0.6/clang+llvm-17.0.6-x86_64-linux-gnu-ubuntu-22.04.tar.xz
          tar -xf clang+llvm-17.0.6-x86_64-linux-gnu-ubuntu-22.04.tar.xz --strip-components=1 -C clang

      # -----------------------------------------------------
      # EXPORT TOOLCHAIN VARS (THIS FIXES YOUR GCC ERROR)
      # -----------------------------------------------------
      - name: Set LLVM env
        run: |
          echo "CLANG_PATH=$GITHUB_WORKSPACE/clang" >> $GITHUB_ENV
          echo "PATH=$GITHUB_WORKSPACE/clang/bin:$PATH" >> $GITHUB_ENV
          echo "CC=clang" >> $GITHUB_ENV
          echo "CXX=clang++" >> $GITHUB_ENV
          echo "LD=ld.lld" >> $GITHUB_ENV
          echo "AR=llvm-ar" >> $GITHUB_ENV
          echo "NM=llvm-nm" >> $GITHUB_ENV
          echo "OBJCOPY=llvm-objcopy" >> $GITHUB_ENV
          echo "OBJDUMP=llvm-objdump" >> $GITHUB_ENV
          echo "STRIP=llvm-strip" >> $GITHUB_ENV
          echo "READELF=llvm-readelf" >> $GITHUB_ENV
          echo "HOSTCC=clang" >> $GITHUB_ENV
          echo "HOSTCXX=clang++" >> $GITHUB_ENV

      # -----------------------------------------------------
      # BUILD STARTS HERE
      # -----------------------------------------------------
      - name: Make defconfig
        run: |
          mkdir -p out
          make LLVM=1 LLVM_IAS=1 ARCH=arm64 \
            O=out \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            obiwan_defconfig

      - name: Build kernel + modules
        run: |
          make -j$(nproc) LLVM=1 LLVM_IAS=1 ARCH=arm64 \
            O=out

      # -----------------------------------------------------
      # UPLOAD .KO FILES
      # -----------------------------------------------------
      - name: Upload modules
        uses: actions/upload-artifact@v4
        with:
          name: kernel-modules
          path: out/**/*.ko
