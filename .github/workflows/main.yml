name: Build Module Only (MODULE_DIR) + AnyKernel

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  ARCH: arm64
  KBUILD_OUTPUT: out
  DEFCONFIG: arch/arm64/configs/obiwan_defconfig
  MODULE_DIR: kernel/out_of_tree/kaeto_mod

jobs:
  build-module:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y bc build-essential curl wget unzip git ccache \
            python3 python-is-python3 rsync zip zstd \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi clang lld

      - name: Download AOSP Clang
        run: |
          mkdir -p clang
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master/clang-r530567.tar.gz -O clang.tar.gz
          tar -xzf clang.tar.gz -C clang --strip-components=1
          echo "CLANG_PATH=$PWD/clang" >> $GITHUB_ENV
          echo "$PWD/clang/bin" >> $GITHUB_PATH

      - name: Print environment
        run: |
          echo "Using defconfig: $DEFCONFIG"
          echo "Module dir: $MODULE_DIR"
          clang --version | head -n 2

      - name: Prepare kernel (modules_prepare)
        run: |
          export PATH="$CLANG_PATH/bin:$PATH"
          export CC=clang
          make O=${KBUILD_OUTPUT} ARCH=${ARCH} ${DEFCONFIG}
          make -C . O=${KBUILD_OUTPUT} ARCH=${ARCH} modules_prepare

      - name: Ensure module dir or create example module
        run: |
          export MODULE_DIR="$MODULE_DIR"
          if [ ! -d "$MODULE_DIR" ]; then
            echo "Module directory missing. Creating example module."
            mkdir -p "$MODULE_DIR"

            cat > "$MODULE_DIR/kaeto_mod.c" << 'C_SRC'
/* kaeto_mod.c - safe example char device */ 

#include <linux/module.h>
#include <linux/kernel.h>
#include <linux/fs.h>
#include <linux/uaccess.h>

#define DEVICE_NAME "kaeto"
static int major;

static ssize_t dummy_read(struct file *f, char __user *buf, size_t len, loff_t *off) {
    const char msg[] = "kaeto example\n";
    return simple_read_from_buffer(buf, len, off, msg, sizeof(msg)-1);
}

static const struct file_operations fops = {
    .owner = THIS_MODULE,
    .read  = dummy_read,
};

static int __init kaeto_init(void) {
    major = register_chrdev(0, DEVICE_NAME, &fops);
    pr_info("kaeto example loaded (major=%d)\n", major);
    return 0;
}

static void __exit kaeto_exit(void) {
    unregister_chrdev(major, DEVICE_NAME);
    pr_info("kaeto example unloaded\n");
}

module_init(kaeto_init);
module_exit(kaeto_exit);
MODULE_LICENSE("GPL");
MODULE_AUTHOR("Example");
MODULE_DESCRIPTION("Safe demo module");
C_SRC

            cat > "$MODULE_DIR/Makefile" << 'MK'
obj-m := kaeto_mod.o
MK
          fi

      - name: Build module
        run: |
          export PATH="$CLANG_PATH/bin:$PATH"
          make -C . O=${KBUILD_OUTPUT} M="$MODULE_DIR" CC=clang -j$(nproc)
          mkdir -p out/modules
          cp -v "$MODULE_DIR"/*.ko out/modules/

      - name: Clone AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3 AnyKernel
          rm -rf AnyKernel/.git

      - name: Package into AnyKernel
        run: |
          mkdir -p AnyKernel/modules
          cp -v out/modules/*.ko AnyKernel/modules/
          cd AnyKernel
          zip -r9 ../AnyKernel-module-${GITHUB_SHA}.zip ./*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: module-artifacts
          path: |
            out/modules/*.ko
            AnyKernel-module-*.zip
