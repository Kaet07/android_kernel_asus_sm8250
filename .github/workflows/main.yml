name: Build Module Only (MODULE_DIR) + AnyKernel

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  ARCH: arm64
  KBUILD_OUTPUT: out
  DEFCONFIG: arch/arm64/configs/obiwan_defconfig
  MODULE_DIR: kernel/out_of_tree/kaeto_mod

jobs:
  build-module:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y bc build-essential curl wget unzip git ccache \
            python3 python-is-python3 rsync zip zstd \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi clang lld

      - name: Download AOSP Clang
        run: |
          mkdir -p clang
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master/clang-r530567.tar.gz -O clang.tar.gz
          tar -xzf clang.tar.gz -C clang --strip-components=1
          echo "CLANG_PATH=$PWD/clang" >> $GITHUB_ENV
          echo "$PWD/clang/bin" >> $GITHUB_PATH

      - name: Print environment
        run: |
          echo "Using defconfig: $DEFCONFIG"
          echo "Module dir: $MODULE_DIR"
          $CLANG_PATH/bin/clang --version | head -n 1 || true
          aarch64-linux-gnu-gcc --version | head -n 1 || true

      - name: Prepare kernel (defconfig + modules_prepare)
        run: |
          export PATH="$CLANG_PATH/bin:$PATH"
          export CC=clang
          export ARCH=arm64
          # write the defconfig into O=${KBUILD_OUTPUT}
          make O=${KBUILD_OUTPUT} ARCH=${ARCH} ${DEFCONFIG}
          # prepare headers for out-of-tree builds (does NOT build full kernel)
          make -C . O=${KBUILD_OUTPUT} ARCH=${ARCH} modules_prepare

      - name: Check module directory exists
        run: |
          if [ ! -d "${MODULE_DIR}" ]; then
            echo "ERROR: Module directory '${MODULE_DIR}' not found in repo."
            echo "Please add your module source at that path (e.g. ${MODULE_DIR}/<your>.c and Makefile)."
            exit 1
          fi
          echo "Module directory found: ${MODULE_DIR}"
          ls -la "${MODULE_DIR}" || true

      - name: Build out-of-tree module(s)
        run: |
          export PATH="$CLANG_PATH/bin:$PATH"
          export CC=clang
          export ARCH=arm64
          make -C . O=${KBUILD_OUTPUT} M="${MODULE_DIR}" CC="$CLANG_PATH/bin/clang" -j$(nproc) || (echo "module build failed" && exit 1)
          mkdir -p out/modules
          cp -v "${MODULE_DIR}"/*.ko out/modules/ 2>/dev/null || true
          echo "Built modules:"
          ls -la out/modules || true

      - name: Optionally sign modules (if secrets provided)
        if: ${{ secrets.MODULE_SIGN_KEY != '' && secrets.MODULE_SIGN_CERT != '' }}
        env:
          PATH: ${{ env.PATH }}
        run: |
          echo "${{ secrets.MODULE_SIGN_KEY }}" > sign_key.pem
          echo "${{ secrets.MODULE_SIGN_CERT }}" > sign_cert.pem
          chmod 600 sign_key.pem
          for ko in out/modules/*.ko; do
            if [ -f "$ko" ]; then
              echo "Signing $ko"
              scripts/sign-file sha512 sign_key.pem sign_cert.pem "$ko" || (echo "sign failed" && exit 1)
            fi
          done
          rm -f sign_key.pem sign_cert.pem

      - name: Clone AnyKernel3 for packaging
        run: |
          rm -rf AnyKernel || true
          git clone https://github.com/osm0sis/AnyKernel3 AnyKernel
          rm -rf AnyKernel/.git || true

      - name: Copy .ko into AnyKernel and add simple loader
        run: |
          mkdir -p AnyKernel/modules
          cp -v out/modules/*.ko AnyKernel/modules/ 2>/dev/null || true
          mkdir -p AnyKernel/ramdisk_patch
          cat > AnyKernel/ramdisk_patch/service.sh <<'SH'
#!/system/bin/sh
# Safe loader: attempt to insmod modules from standard locations (no signature bypass).
insmod /vendor/lib/modules/*.ko 2>/dev/null || true
insmod /system/lib/modules/*.ko 2>/dev/null || true
insmod /lib/modules/*.ko 2>/dev/null || true
SH
          chmod 755 AnyKernel/ramdisk_patch/service.sh
          echo "AnyKernel modules:"
          find AnyKernel/modules -type f -name '*.ko' -print || true

      - name: Create AnyKernel module zip
        run: |
          cd AnyKernel
          zip -r9 ../AnyKernel-module-${GITHUB_SHA}.zip ./*

      - name: Upload module artifacts (.ko + zip)
        uses: actions/upload-artifact@v4
        with:
          name: module-artifacts
          path: |
            out/modules/*.ko
            AnyKernel-module-*.zip
          if-no-files-found: error
