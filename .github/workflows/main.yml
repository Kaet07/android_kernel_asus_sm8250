name: Build Kernel + AnyKernel

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  ARCH: arm64
  KBUILD_OUTPUT: out
  DEFCONFIG: obiwan_defconfig

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install packages
        run: |
          sudo apt update
          sudo apt install -y bc bison flex git build-essential \
          ccache curl wget unzip gcc-aarch64-linux-gnu \
          gcc-arm-linux-gnueabi python3 libssl-dev zip rsync

      - name: Download Proton Clang
        run: |
          mkdir -p clang
          wget -q https://github.com/kdrag0n/proton-clang/archive/refs/heads/master.zip -O pc.zip
          unzip -q pc.zip -d clang
          mv clang/proton-clang-master/* clang/
          echo "$PWD/clang/bin" >> $GITHUB_PATH

      - name: Make defconfig
        run: |
          make O=${KBUILD_OUTPUT} ARCH=arm64 ${DEFCONFIG}

      - name: Build kernel + modules
        run: |
          export CC=clang
          export LD=ld.lld
          make -j$(nproc) O=${KBUILD_OUTPUT} ARCH=arm64

      - name: Install modules
        run: |
          rm -rf mod_tmp
          mkdir mod_tmp
          make O=${KBUILD_OUTPUT} ARCH=arm64 INSTALL_MOD_PATH=$PWD/mod_tmp modules_install

      - name: Clone AnyKernel3
        run: |
          rm -rf AnyKernel
          git clone https://github.com/osm0sis/AnyKernel3 AnyKernel
          rm -rf AnyKernel/.git

      - name: Replace anykernel.sh (no heredoc!)
        run: |
          echo "#!/sbin/sh" > AnyKernel/anykernel.sh
          echo "properties() { '" >> AnyKernel/anykernel.sh
          echo "kernel.string=KaetoKernel" >> AnyKernel/anykernel.sh
          echo "do.devicecheck=0" >> AnyKernel/anykernel.sh
          echo "do.modules=1" >> AnyKernel/anykernel.sh
          echo "do.systemless=1" >> AnyKernel/anykernel.sh
          echo "do.cleanup=1" >> AnyKernel/anykernel.sh
          echo "do.cleanuponabort=0" >> AnyKernel/anykernel.sh
          echo "'; }" >> AnyKernel/anykernel.sh

          echo "BLOCK=/dev/block/by-name/boot" >> AnyKernel/anykernel.sh
          echo "IS_SLOT_DEVICE=1" >> AnyKernel/anykernel.sh

          echo ". tools/ak3-core.sh" >> AnyKernel/anykernel.sh
          echo "split_boot" >> AnyKernel/anykernel.sh
          echo "flash_boot" >> AnyKernel/anykernel.sh
          echo "install_modules" >> AnyKernel/anykernel.sh
          chmod +x AnyKernel/anykernel.sh

      - name: Copy kernel images
        run: |
          cp out/arch/arm64/boot/Image* AnyKernel/ 2>/dev/null || true
          cp out/arch/arm64/boot/dtbo.img AnyKernel/ 2>/dev/null || true

      - name: Copy modules
        run: |
          KVER=$(make -s O=${KBUILD_OUTPUT} kernelrelease)
          mkdir -p AnyKernel/modules/$KVER
          cp mod_tmp/lib/modules/$KVER/*.ko AnyKernel/modules/$KVER/ 2>/dev/null || true

      - name: Create ZIP
        run: |
          cd AnyKernel
          zip -r9 ../AnyKernel-${GITHUB_SHA}.zip .

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel
          path: AnyKernel-*.zip
