name: Build Kernel

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  ARCH: arm64
  SUBARCH: arm64
  KBUILD_OUTPUT: out
  DEFCONFIG: obiwan_defconfig

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install required packages
        run: |
          sudo apt update
          sudo apt install -y \
            bc bison flex build-essential git ccache curl wget unzip \
            libssl-dev python-is-python3 python3 \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            zstd

      # ---------------------------------------------------------
      # 100% RELIABLE TOOLCHAIN - ZYC CLANG 18
      # ---------------------------------------------------------

      - name: Download ZyC Clang 18
        run: |
          mkdir -p clang
          wget -q https://downloads.sourceforge.net/project/zycc-os/toolchains/clang/18/clang-18.tar.zst -O clang.tar.zst
          tar --use-compress-program=unzstd -xf clang.tar.zst -C clang
          echo "CLANG_PATH=$PWD/clang" >> $GITHUB_ENV
          echo "$PWD/clang/bin" >> $GITHUB_PATH

      # ---------------------------------------------------------
      # EXPORT TOOLCHAIN VARIABLES
      # ---------------------------------------------------------

      - name: Export toolchain variables
        run: |
          echo "CC=$CLANG_PATH/bin/clang" >> $GITHUB_ENV
          echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
          echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> $GITHUB_ENV
          echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> $GITHUB_ENV

      # ---------------------------------------------------------
      # BUILD DEFCONFIG
      # ---------------------------------------------------------

      - name: Make defconfig
        run: |
          make O=${KBUILD_OUTPUT} $DEFCONFIG

      # ---------------------------------------------------------
      # BUILD KERNEL
      # ---------------------------------------------------------

      - name: Build Kernel Image (Image.gz-dtb)
        run: |
          make -j$(nproc) \
            O=${KBUILD_OUTPUT} \
            ARCH=arm64 \
            CC="$CLANG_PATH/bin/clang"

      # ---------------------------------------------------------
      # BUILD DTBO
      # ---------------------------------------------------------

      - name: Build DTBO image
        run: |
          make -j$(nproc) \
            O=${KBUILD_OUTPUT} \
            ARCH=arm64 \
            dtboimg || true

      # ---------------------------------------------------------
      # ANYKERNEL PACKAGING
      # ---------------------------------------------------------

      - name: Clone AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3 AnyKernel

      - name: Copy kernel output to AnyKernel3
        run: |
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel/ || true
          cp out/arch/arm64/boot/Image.gz AnyKernel/ || true
          cp out/arch/arm64/boot/Image AnyKernel/ || true
          cp out/arch/arm64/boot/dtbo.img AnyKernel/ || true
          rm -f AnyKernel/patch AnyKernel/modules || true

      - name: Create flashable ZIP
        run: |
          cd AnyKernel
          zip -r9 ../AnyKernel-${GITHUB_SHA}.zip ./*

      # ---------------------------------------------------------
      # UPLOAD ARTIFACTS
      # ---------------------------------------------------------

      - name: Upload Kernel Files
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Artifacts
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/dtbo.img
          if-no-files-found: warn

      - name: Upload AnyKernel3 ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Flashable-AnyKernel3
          path: AnyKernel-*.zip
          if-no-files-found: error
