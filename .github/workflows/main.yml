name: Build Kernel + Safe AnyKernel (modules + split flash)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  ARCH: arm64
  KBUILD_OUTPUT: out
  DEFCONFIG: obiwan_defconfig

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install packages (build deps)
        run: |
          sudo apt update
          sudo apt install -y \
            bc bison flex build-essential git ccache curl wget unzip \
            libssl-dev python3 python-is-python3 gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi libncurses-dev rsync zip

      - name: Download ProtonPlus Clang (compatible)
        run: |
          mkdir -p clang
          wget -q https://github.com/ProtonPlus/proton-clang/releases/download/2024.12/ProtonPlus-2024.12.tar.zst -O clang.tar.zst
          tar --use-compress-program=unzstd -xf clang.tar.zst -C clang
          # Put clang bin in PATH for later steps
          echo "CLANG_PATH=$PWD/clang" >> $GITHUB_ENV
          echo "$PWD/clang/bin" >> $GITHUB_PATH

      - name: Export toolchain environment
        run: |
          echo "CC=clang" >> $GITHUB_ENV
          echo "HOSTCC=clang" >> $GITHUB_ENV
          echo "HOSTCXX=clang++" >> $GITHUB_ENV
          echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
          echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> $GITHUB_ENV
          echo "LD=ld.lld" >> $GITHUB_ENV
          echo "AR=llvm-ar" >> $GITHUB_ENV
          echo "NM=llvm-nm" >> $GITHUB_ENV
          echo "OBJCOPY=llvm-objcopy" >> $GITHUB_ENV
          echo "OBJDUMP=llvm-objdump" >> $GITHUB_ENV
          echo "STRIP=llvm-strip" >> $GITHUB_ENV
          echo "READELF=llvm-readelf" >> $GITHUB_ENV
          echo "LLVM=1" >> $GITHUB_ENV
          echo "LLVM_IAS=1" >> $GITHUB_ENV

      - name: Configure kernel (obiwan_defconfig)
        run: |
          export PATH="$CLANG_PATH/bin:$PATH"
          make O=${KBUILD_OUTPUT} ARCH=${ARCH} ${DEFCONFIG}

      - name: Build kernel and modules
        run: |
          export PATH="$CLANG_PATH/bin:$PATH"
          export CC="$CLANG_PATH/bin/clang"
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip
          make -j$(nproc) O=${KBUILD_OUTPUT} ARCH=${ARCH}

      - name: Build DTBO (if supported)
        run: |
          export PATH="$CLANG_PATH/bin:$PATH"
          make -j$(nproc) O=${KBUILD_OUTPUT} ARCH=${ARCH} dtboimg || true

      - name: Install modules into temporary tree
        run: |
          rm -rf mod_tmp
          mkdir -p mod_tmp
          # Ensure modules_install uses the kernel we just built
          make -j1 O=${KBUILD_OUTPUT} ARCH=${ARCH} INSTALL_MOD_PATH=$PWD/mod_tmp modules_install || true
          echo "Installed modules (if any):"
          find mod_tmp -type f -name '*.ko' -print || true

      - name: Get kernel release name (KVER)
        id: kernelver
        run: |
          KVER=$(make -s O=${KBUILD_OUTPUT} kernelrelease)
          echo "KVER=${KVER}" >> "$GITHUB_OUTPUT"
          echo "Kernel release: ${KVER}"

      - name: Clone AnyKernel3
        run: |
          rm -rf AnyKernel
          git clone https://github.com/osm0sis/AnyKernel3 AnyKernel
          rm -rf AnyKernel/.git || true

      - name: Create safe anykernel.sh (split flash + install modules)
        run: |
          # build a minimal anykernel wrapper that uses AK3 core functions
          # Use echo/printf (not heredoc) to avoid YAML quoting pitfalls
          echo "#!/sbin/sh" > AnyKernel/anykernel.sh
          echo "properties() { '" >> AnyKernel/anykernel.sh
          echo "kernel.string=KaetoKernel (obiwan) by Kaeto" >> AnyKernel/anykernel.sh
          echo "do.devicecheck=1" >> AnyKernel/anykernel.sh
          echo "do.modules=1" >> AnyKernel/anykernel.sh
          echo "do.systemless=1" >> AnyKernel/anykernel.sh
          echo "do.cleanup=1" >> AnyKernel/anykernel.sh
          echo "do.cleanuponabort=0" >> AnyKernel/anykernel.sh
          echo "'; }" >> AnyKernel/anykernel.sh
          echo " " >> AnyKernel/anykernel.sh
          echo "BLOCK=/dev/block/by-name/boot" >> AnyKernel/anykernel.sh
          echo "IS_SLOT_DEVICE=1" >> AnyKernel/anykernel.sh
          echo ". tools/ak3-core.sh" >> AnyKernel/anykernel.sh
          echo "split_boot" >> AnyKernel/anykernel.sh
          echo "flash_boot" >> AnyKernel/anykernel.sh
          echo "install_modules" >> AnyKernel/anykernel.sh
          chmod +x AnyKernel/anykernel.sh

      - name: Copy kernel images and dtbo into AnyKernel
        run: |
          cp -v out/arch/arm64/boot/Image.gz-dtb AnyKernel/ 2>/dev/null || true
          cp -v out/arch/arm64/boot/Image.gz AnyKernel/ 2>/dev/null || true
          cp -v out/arch/arm64/boot/Image AnyKernel/ 2>/dev/null || true
          cp -v out/arch/arm64/boot/dtbo.img AnyKernel/ 2>/dev/null || true

      - name: Copy modules into AnyKernel/modules/<kver>
        run: |
          KVER=${{ steps.kernelver.outputs.KVER }}
          mkdir -p "AnyKernel/modules/${KVER}"
          if [ -d "mod_tmp/lib/modules/${KVER}" ]; then
            cp -v mod_tmp/lib/modules/${KVER}/*.ko "AnyKernel/modules/${KVER}/" || true
            # generate modules.dep (optional) to help modprobe later
            (cd mod_tmp/lib/modules/${KVER} && depmod -b $PWD $KVER) || true
            # copy module dependency files if created
            cp -v mod_tmp/lib/modules/${KVER}/modules.* "AnyKernel/modules/${KVER}/" 2>/dev/null || true
          fi
          echo "AnyKernel modules tree:"
          find AnyKernel/modules -type f -name '*.ko' -print || true

      - name: Add safe service script (ramdisk_patch/service.sh)
        run: |
          mkdir -p AnyKernel/ramdisk_patch
          echo "#!/system/bin/sh" > AnyKernel/ramdisk_patch/service.sh
          echo "insmod /vendor/lib/modules/*.ko 2>/dev/null || true" >> AnyKernel/ramdisk_patch/service.sh
          echo "insmod /system/lib/modules/*.ko 2>/dev/null || true" >> AnyKernel/ramdisk_patch/service.sh
          echo "insmod /lib/modules/*.ko 2>/dev/null || true" >> AnyKernel/ramdisk_patch/service.sh
          echo "if [ -f /data/kaeto/run_after_module.sh ]; then" >> AnyKernel/ramdisk_patch/service.sh
          echo "  sh /data/kaeto/run_after_module.sh || true" >> AnyKernel/ramdisk_patch/service.sh
          echo "fi" >> AnyKernel/ramdisk_patch/service.sh
          chmod 755 AnyKernel/ramdisk_patch/service.sh

      - name: Create AnyKernel config.txt (A/B + modules enabled)
        run: |
          echo "kernel.string=KaetoKernel (obiwan) by Kaeto" > AnyKernel/config.txt
          echo "do.devicecheck=1" >> AnyKernel/config.txt
          echo "do.modules=1" >> AnyKernel/config.txt
          echo "do.systemless=1" >> AnyKernel/config.txt
          echo "do.cleanup=1" >> AnyKernel/config.txt
          echo "do.cleanuponabort=0" >> AnyKernel/config.txt
          echo "is_slot_device=1" >> AnyKernel/config.txt
          echo "block=/dev/block/by-name/boot" >> AnyKernel/config.txt
          echo "device.name1=obiwan" >> AnyKernel/config.txt
          echo "device.name2=ZS661KS" >> AnyKernel/config.txt
          echo "device.name3=ZS661KL" >> AnyKernel/config.txt
          echo "device.name4=ASUS_I003_1" >> AnyKernel/config.txt
          echo "device.name5=I003D" >> AnyKernel/config.txt
          echo "device.name6=I003DD" >> AnyKernel/config.txt

      - name: Create flashable AnyKernel zip (safe)
        run: |
          cd AnyKernel
          zip -r9 ../AnyKernel-safe-${GITHUB_SHA}.zip ./*

      - name: Upload AnyKernel SAFE zip
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel-safe-zip
          path: AnyKernel-safe-*.zip
          if-no-files-found: error

      - name: Upload kernel artifacts and modules
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-artifacts
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/dtbo.img
            mod_tmp/lib/modules/${{ steps.kernelver.outputs.KVER }}/*.ko
          if-no-files-found: warn
