name: Build Kernel

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  ARCH: arm64
  SUBARCH: arm64
  DEFCONFIG: obiwan_defconfig
  KBUILD_OUTPUT: out

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install required packages
        run: |
          sudo apt update
          sudo apt install -y bc bison flex build-essential git curl wget unzip \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libc6-dev libssl-dev

      - name: Download & extract Proton Clang
        run: |
          mkdir clang
          wget https://github.com/kdrag0n/proton-clang/archive/refs/heads/master.zip -O clang.zip
          unzip clang.zip -d clang
          mv clang/proton-clang-master/* clang/

      - name: Export toolchain paths
        run: |
          echo "CLANG_PATH=$GITHUB_WORKSPACE/clang/bin" >> $GITHUB_ENV
          echo "CC=$GITHUB_WORKSPACE/clang/bin/clang" >> $GITHUB_ENV
          echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
          echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> $GITHUB_ENV
          echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> $GITHUB_ENV

      - name: Configure defconfig
        run: |
          make O=${KBUILD_OUTPUT} $DEFCONFIG

      - name: Build kernel + modules
        run: |
          make -j$(nproc) O=${KBUILD_OUTPUT} \
            CC="${CLANG_PATH}/clang" \
            ARCH=arm64

      - name: Install kernel modules
        run: |
          mkdir -p out/modules
          make O=${KBUILD_OUTPUT} modules_install INSTALL_MOD_PATH=out/modules

      - name: Clone AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git ak3
          rm -rf ak3/.git
          rm -rf ak3/modules
          mkdir -p ak3/modules/vendor/lib/modules
          cp -r out/modules/lib/modules/* ak3/modules/vendor/lib/modules/

      - name: Copy kernel image into AnyKernel3
        run: |
          cp out/arch/arm64/boot/Image.gz-dtb ak3/

      - name: Fix AnyKernel3 properties
        run: |
          sed -i 's/do.devicecheck=.*/do.devicecheck=0/' ak3/anykernel.sh
          sed -i 's|BLOCK=.*|IS_SLOT_DEVICE=1|' ak3/anykernel.sh
          sed -i 's|BLOCK=.*|# Auto-slot device|' ak3/anykernel.sh

      - name: Create flashable AnyKernel zip
        run: |
          cd ak3
          zip -r9 ../AnyKernel3-Kernel.zip .

      - name: Upload flashable kernel zip
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3-Kernel
          path: AnyKernel3-Kernel.zip
