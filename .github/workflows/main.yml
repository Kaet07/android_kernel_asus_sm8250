name: Build Kernel

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  ARCH: arm64
  SUBARCH: arm64
  KBUILD_OUTPUT: out
  DEFCONFIG: obiwan_defconfig

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc bison flex build-essential git ccache curl wget unzip \
            libssl-dev python3 python-is-python3 \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi

      - name: Download Neutron Clang (r27)
        run: |
          mkdir clang
          wget https://github.com/Neutron-Clang/neutron-toolchain/releases/download/2024.05/Neutron-2024.05.tar.zst -O clang.tar.zst
          tar --zstd -xf clang.tar.zst -C clang
          echo "CLANG_PATH=$PWD/clang" >> $GITHUB_ENV

      - name: Export toolchain vars
        run: |
          echo "CC=$CLANG_PATH/bin/clang" >> $GITHUB_ENV
          echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
          echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> $GITHUB_ENV
          echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> $GITHUB_ENV

      - name: Make defconfig
        run: |
          make O=${KBUILD_OUTPUT} $DEFCONFIG

      - name: Build Kernel
        run: |
          make -j$(nproc) \
            O=${KBUILD_OUTPUT} \
            CC="$CLANG_PATH/bin/clang" \
            LLVM=1 \
            ARCH=arm64

      - name: Build DTBO
        run: |
          make -j$(nproc) \
            O=${KBUILD_OUTPUT} ARCH=arm64 dtboimg || true

      - name: Clone AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3 AnyKernel

      - name: Copy kernel output
        run: |
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel/ || true
          cp out/arch/arm64/boot/Image.gz AnyKernel/ || true
          cp out/arch/arm64/boot/Image AnyKernel/ || true
          cp out/arch/arm64/boot/dtbo.img AnyKernel/ || true
          rm -f AnyKernel/patch AnyKernel/modules || true

      - name: Create flashable ZIP
        run: |
          cd AnyKernel
          zip -r9 ../AnyKernel-${GITHUB_SHA}.zip ./*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Flashable-Kernel
          path: AnyKernel-*.zip
