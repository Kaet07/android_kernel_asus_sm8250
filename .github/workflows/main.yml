name: Build Kernel + Module + AnyKernel3

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  ARCH: arm64
  SUBARCH: arm64
  KBUILD_OUTPUT: out
  DEFCONFIG: obiwan_defconfig

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source
      - name: Checkout source
        uses: actions/checkout@v4

      # 2. Install required packages
      - name: Install required packages
        run: |
          sudo apt update
          sudo apt install -y \
            bc bison flex build-essential git ccache curl wget unzip \
            libssl-dev python3 python-is-python3 \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      # 3. Download Proton Clang
      - name: Download Proton Clang
        run: |
          mkdir -p clang
          wget -q https://github.com/kdrag0n/proton-clang/archive/refs/heads/master.zip -O clang.zip
          unzip clang.zip -d clang
          mv clang/proton-clang-master/* clang/
          echo "CLANG_PATH=$PWD/clang" >> $GITHUB_ENV
          echo "$PWD/clang/bin" >> $GITHUB_PATH

      # 4. Export toolchain variables
      - name: Export toolchain variables
        run: |
          echo "CC=$CLANG_PATH/bin/clang" >> $GITHUB_ENV
          echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
          echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> $GITHUB_ENV
          echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> $GITHUB_ENV

      # 5. Make defconfig
      - name: Make defconfig
        run: |
          make O=${KBUILD_OUTPUT} $DEFCONFIG

      # 6. Build Kernel Image
      - name: Build Kernel
        run: |
          make -j$(nproc) O=${KBUILD_OUTPUT} ARCH=arm64 CC="$CLANG_PATH/bin/clang"

      # 7. Build DTBO
      - name: Build DTBO
        run: |
          make -j$(nproc) O=${KBUILD_OUTPUT} ARCH=arm64 dtboimg || true

      # 8. Build custom kernel module (.ko)
      - name: Build Custom Kernel Module
        run: |
          mkdir -p kernel/my_module
          # Create example module source
          cat > kernel/my_module/my_module.c << 'EOF'
#include <linux/module.h>
#include <linux/kernel.h>
#include <linux/proc_fs.h>

static struct proc_dir_entry *entry;

static ssize_t my_read(struct file *filp, char __user *buf, size_t count, loff_t *off) {
    const char msg[] = "Hello from kernel module\n";
    return simple_read_from_buffer(buf, count, off, msg, sizeof(msg)-1);
}

static const struct proc_ops fops = {
    .proc_read = my_read,
};

static int __init my_init(void) {
    entry = proc_create("my_module", 0444, NULL, &fops);
    printk(KERN_INFO "my_module loaded\n");
    return 0;
}

static void __exit my_exit(void) {
    proc_remove(entry);
    printk(KERN_INFO "my_module unloaded\n");
}

module_init(my_init);
module_exit(my_exit);
MODULE_LICENSE("GPL");
EOF

          # Create Makefile for module
          cat > kernel/my_module/Makefile << 'EOF'
obj-m := my_module.o
KDIR := $(PWD)/../../
PWD := $(shell pwd)

all:
	$(MAKE) -C $(KDIR) O=$(KDIR)/out M=$(PWD) modules

clean:
	$(MAKE) -C $(KDIR) O=$(KDIR)/out M=$(PWD) clean
EOF

          # Build the module
          cd kernel/my_module
          make -j$(nproc)
          cp my_module.ko $GITHUB_WORKSPACE/out/

      # 9. Clone AnyKernel3
      - name: Clone AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3 AnyKernel

      # 10. Copy kernel + module to AnyKernel3
      - name: Copy kernel and module
        run: |
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel/ || true
          cp out/arch/arm64/boot/Image.gz AnyKernel/ || true
          cp out/arch/arm64/boot/Image AnyKernel/ || true
          cp out/arch/arm64/boot/dtbo.img AnyKernel/ || true
          mkdir -p AnyKernel/modules
          cp out/my_module.ko AnyKernel/modules/ || true

      # 11. Create flashable ZIP
      - name: Create AnyKernel3 ZIP
        run: |
          cd AnyKernel
          zip -r9 ../AnyKernel-${GITHUB_SHA}.zip ./*

      # 12. Upload Kernel Artifacts
      - name: Upload Kernel Files
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Artifacts
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/dtbo.img
            out/my_module.ko
          if-no-files-found: warn

      # 13. Upload AnyKernel3 ZIP
      - name: Upload AnyKernel3 ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Flashable-AnyKernel3
          path: AnyKernel-*.zip
          if-no-files-found: error
