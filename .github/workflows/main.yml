name: Build Kernel

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  ARCH: arm64
  SUBARCH: arm64
  KBUILD_OUTPUT: out
  DEFCONFIG: obiwan_defconfig

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install required packages
        run: |
          sudo apt update
          sudo apt install -y \
            bc bison flex build-essential git ccache curl wget unzip \
            libssl-dev python3 python-is-python3

      - name: Download Proton Clang
        run: |
          mkdir -p clang
          wget https://github.com/kdrag0n/proton-clang/archive/refs/heads/master.zip -O clang.zip
          unzip clang.zip -d clang
          mv clang/proton-clang-master/* clang/
          echo "CLANG_PATH=$PWD/clang" >> $GITHUB_ENV

      - name: Export clang + llvm environment
        run: |
          echo "PATH=$CLANG_PATH/bin:$PATH" >> $GITHUB_ENV
          echo "CC=clang" >> $GITHUB_ENV
          echo "HOSTCC=clang" >> $GITHUB_ENV
          echo "HOSTCXX=clang++" >> $GITHUB_ENV
          echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
          echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> $GITHUB_ENV
          echo "LD=ld.lld" >> $GITHUB_ENV
          echo "AR=llvm-ar" >> $GITHUB_ENV
          echo "NM=llvm-nm" >> $GITHUB_ENV
          echo "OBJCOPY=llvm-objcopy" >> $GITHUB_ENV
          echo "OBJDUMP=llvm-objdump" >> $GITHUB_ENV
          echo "STRIP=llvm-strip" >> $GITHUB_ENV
          echo "READELF=llvm-readelf" >> $GITHUB_ENV
          echo "LLVM=1" >> $GITHUB_ENV
          echo "LLVM_IAS=1" >> $GITHUB_ENV

      - name: Make defconfig
        run: |
          make O=${KBUILD_OUTPUT} $DEFCONFIG

      - name: Build Kernel
        run: |
          make -j$(nproc) O=${KBUILD_OUTPUT}

      - name: Build DTBO
        run: |
          make -j$(nproc) O=${KBUILD_OUTPUT} dtboimg || true

      - name: Clone AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3 AnyKernel

      - name: Copy kernel files into AnyKernel
        run: |
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel/ || true
          cp out/arch/arm64/boot/Image.gz AnyKernel/ || true
          cp out/arch/arm64/boot/Image AnyKernel/ || true
          cp out/arch/arm64/boot/dtbo.img AnyKernel/ || true
          rm -f AnyKernel/patch AnyKernel/modules || true

      - name: Create flashable zip
        run: |
          cd AnyKernel
          zip -r9 ../AnyKernel-${GITHUB_SHA}.zip ./*

      - name: Upload Kernel Files
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Artifacts
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/dtbo.img

      - name: Upload AnyKernel zip
        uses: actions/upload-artifact@v4
        with:
          name: Flashable-AnyKernel3
          path: AnyKernel-*.zip
